<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NHL '95</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
    rel="stylesheet"
  />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Press Start 2P', monospace;
      overflow: hidden;
    }

    canvas {
      display: block;
      /* Keep pixels sharp — no browser smoothing */
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    #controls {
      margin-top: 10px;
      color: #444;
      font-size: 7px;
      letter-spacing: 1px;
      text-align: center;
      line-height: 2;
    }
  </style>
</head>
<body>

<canvas id="c" width="800" height="520"></canvas>

<div id="controls">
  P1: ARROWS · SPACE=shoot/charge · Q=pass · TAB=switch
  &nbsp;|&nbsp;
  P2: WASD · ENTER=shoot/charge · E=pass · SHIFT=switch
</div>

<script src="teams.js"></script>
<script>
'use strict';

// ─── Canvas ───────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

const W = 800;
const H = 520;

// ─── Game state ───────────────────────────────────────────────────────────────
// Possible values:
//   'team_select'  – P1 and P2 are choosing teams
//   'faceoff'      – countdown before puck drop
//   'playing'      – live play
//   'goal'         – goal celebration pause
//   'period_end'   – brief pause between periods
//   'game_end'     – final score screen
const game = {
  state:      'team_select',
  period:     1,
  periodTime: 180,       // seconds per period (3 × 3-min)
  scores:     [0, 0],   // [home, away]
  homeTeam:   null,     // filled in after team select (index into TEAMS)
  awayTeam:   null,
};

// ─── Input ────────────────────────────────────────────────────────────────────
const keys = {};

document.addEventListener('keydown', e => {
  if (!keys[e.code]) onKeyDown(e.code);
  keys[e.code] = true;
  // Prevent arrow keys / space scrolling the page
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) {
    e.preventDefault();
  }
});

document.addEventListener('keyup', e => {
  keys[e.code] = false;
  onKeyUp(e.code);
});

// ─── Team Select ─────────────────────────────────────────────────────────────
const SEL = { p1: 0, p2: 4, p1done: false, p2done: false };

const TS_COLS  = 8;
const TS_CW    = 96;   // cell width  (includes gap)
const TS_CH    = 70;   // cell height (includes gap)
const TS_GX    = 8;    // grid left
const TS_GY    = 56;   // grid top

function tsCell(i) {
  return {
    x: TS_GX + (i % TS_COLS) * TS_CW,
    y: TS_GY + Math.floor(i / TS_COLS) * TS_CH,
    w: TS_CW - 3,
    h: TS_CH - 3,
  };
}

function drawTeamSelect() {
  // ── background
  ctx.fillStyle = '#000820';
  ctx.fillRect(0, 0, W, H);

  // scanline overlay
  for (let sy = 0; sy < H; sy += 4) {
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.fillRect(0, sy, W, 1);
  }

  // ── title bar
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle    = '#FFD700';
  ctx.font         = '13px "Press Start 2P"';
  ctx.fillText("NHL '95", W / 2, 18);

  ctx.fillStyle = '#6688AA';
  ctx.font      = '7px "Press Start 2P"';
  ctx.fillText('CHOOSE YOUR TEAMS', W / 2, 38);

  // ── division row labels (left of grid)
  const DIVS = ['ATLANTIC', 'METROPOLITAN', 'CENTRAL', 'PACIFIC'];
  ctx.font      = '5px "Press Start 2P"';
  ctx.textAlign = 'right';
  ctx.fillStyle = '#334466';
  DIVS.forEach((d, r) => {
    ctx.fillText(d, TS_GX - 2, TS_GY + r * TS_CH + TS_CH / 2 - 1);
  });

  // ── team cells
  for (let i = 0; i < TEAMS.length; i++) {
    const t = TEAMS[i];
    const { x, y, w, h } = tsCell(i);

    // primary fill
    ctx.fillStyle = t.primary;
    ctx.fillRect(x, y, w, h);

    // secondary stripe at bottom
    ctx.fillStyle = t.secondary;
    ctx.fillRect(x, y + h - 9, w, 9);

    const cellLogo = typeof LOGOS !== 'undefined' && LOGOS[t.abbr];
    if (cellLogo) {
      // fit logo inside cell above the stripe, with small padding
      const pad = 3;
      ctx.drawImage(cellLogo, x + pad, y + pad, w - pad * 2, h - 9 - pad * 2);
    } else {
      // fallback: abbreviation text
      ctx.fillStyle    = t.textColor;
      ctx.font         = '8px "Press Start 2P"';
      ctx.textAlign    = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(t.abbr, x + w / 2, y + h / 2 - 5);

      const lastWord = t.city.split(' ').pop();
      ctx.font      = '5px "Press Start 2P"';
      ctx.fillStyle = t.textColor === '#FFFFFF' ? '#FFFFFF' : t.primary;
      ctx.fillText(lastWord, x + w / 2, y + h - 4);
    }
  }

  // ── cursors (drawn after cells so they appear on top)
  const cursors = [
    { idx: SEL.p1, done: SEL.p1done, color: '#FFD700', label: 'P1' },
    { idx: SEL.p2, done: SEL.p2done, color: '#00E5FF', label: 'P2' },
  ];
  cursors.forEach(cur => {
    const { x, y, w, h } = tsCell(cur.idx);
    ctx.strokeStyle = cur.done ? 'rgba(255,255,255,0.35)' : cur.color;
    ctx.lineWidth   = 3;
    ctx.strokeRect(x - 1, y - 1, w + 2, h + 2);

    // label tab above cell (clamp so row-0 label stays on canvas)
    const labelY = y > TS_GY + 10 ? y - 10 : y + h + 12;
    ctx.fillStyle    = cur.done ? 'rgba(255,255,255,0.35)' : cur.color;
    ctx.font         = '6px "Press Start 2P"';
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(cur.label, x + w / 2, labelY);
  });

  // ── bottom info panels
  const panelY = TS_GY + 4 * TS_CH + 6;
  const panelH = H - panelY - 2;
  const half   = Math.floor(W / 2) - 2;

  function drawPanel(team, px, cursor) {
    // background
    ctx.fillStyle = team.primary;
    ctx.fillRect(px, panelY, half, panelH);
    // accent stripe
    ctx.fillStyle = team.secondary;
    ctx.fillRect(px, panelY + panelH - 5, half, 5);

    ctx.textAlign    = 'left';
    ctx.textBaseline = 'top';
    ctx.fillStyle    = team.textColor;
    ctx.font         = '8px "Press Start 2P"';
    ctx.fillText(team.name, px + 8, panelY + 8);
    ctx.font         = '6px "Press Start 2P"';
    ctx.fillText(
      (team.conf === 'E' ? 'EAST' : 'WEST') + ' · ' + team.div.toUpperCase(),
      px + 8, panelY + 22
    );
    if (cursor.done) {
      ctx.fillStyle = '#00FF88';
      ctx.font      = '7px "Press Start 2P"';
      ctx.fillText('LOCKED IN ✓', px + 8, panelY + 36);
    } else {
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.font      = '6px "Press Start 2P"';
      ctx.fillText(cursor.label + ': ARROWS+SPACE', px + 8, panelY + 36);
    }
  }

  drawPanel(TEAMS[SEL.p1], 0,      cursors[0]);
  drawPanel(TEAMS[SEL.p2], half + 4, cursors[1]);

  // vs divider
  ctx.fillStyle = '#111';
  ctx.fillRect(half, panelY, 4, panelH);
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle    = '#FFFFFF';
  ctx.font         = '10px "Press Start 2P"';
  ctx.fillText('VS', W / 2, panelY + panelH / 2);

  // status line
  ctx.fillStyle    = '#334';
  ctx.font         = '6px "Press Start 2P"';
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'bottom';
  ctx.fillText(
    (SEL.p1done && SEL.p2done) ? 'GET READY...' : 'P2: WASD + ENTER',
    W / 2, H
  );
}

// ─── Key handlers ─────────────────────────────────────────────────────────────
function onKeyDown(code) {
  if (game.state === 'team_select') tsKeyDown(code);
}
function onKeyUp(code) {}

function tsMove(cur, dc, dr) {
  const col = ((cur % TS_COLS) + dc + TS_COLS) % TS_COLS;
  const row = (Math.floor(cur / TS_COLS) + dr + 4) % 4;
  return row * TS_COLS + col;
}

function tsKeyDown(code) {
  if (!SEL.p1done) {
    if (code === 'ArrowLeft')  SEL.p1 = tsMove(SEL.p1, -1,  0);
    if (code === 'ArrowRight') SEL.p1 = tsMove(SEL.p1,  1,  0);
    if (code === 'ArrowUp')    SEL.p1 = tsMove(SEL.p1,  0, -1);
    if (code === 'ArrowDown')  SEL.p1 = tsMove(SEL.p1,  0,  1);
    if (code === 'Space')      SEL.p1done = true;
  }
  if (!SEL.p2done) {
    if (code === 'KeyA')    SEL.p2 = tsMove(SEL.p2, -1,  0);
    if (code === 'KeyD')    SEL.p2 = tsMove(SEL.p2,  1,  0);
    if (code === 'KeyW')    SEL.p2 = tsMove(SEL.p2,  0, -1);
    if (code === 'KeyS')    SEL.p2 = tsMove(SEL.p2,  0,  1);
    if (code === 'Enter')   SEL.p2done = true;
  }
  if (SEL.p1done && SEL.p2done) {
    game.homeTeam = SEL.p1;
    game.awayTeam = SEL.p2;
    setTimeout(() => { game.state = 'faceoff'; }, 1200);
  }
}

// ─── Main render loop ─────────────────────────────────────────────────────────
function render(t) {
  ctx.fillStyle = '#000010';
  ctx.fillRect(0, 0, W, H);

  if (game.state === 'team_select') {
    drawTeamSelect();
  } else {
    tickClock(t);
    updateGoalieAI();
    updatePlayers();
    resolveCollisions();
    updatePuck();
    updateShooting();
    updatePassing();
    drawRink();
    drawAllPlayers();
    drawPassIndicator();
    drawPuck();
    drawShootingEffects();
    drawScoreboard();
    drawFaceoffOverlay();
  }

  requestAnimationFrame(render);
}

requestAnimationFrame(render);
</script>

<script>
// ─── Chunk 4: Rink ────────────────────────────────────────────────────────────

const RINK = { x: 20, y: 38, w: 760, h: 440, r: 78 };
RINK.cx = RINK.x + RINK.w / 2;   // 400
RINK.cy = RINK.y + RINK.h / 2;   // 258

// Key x positions (used by physics chunks too)
const GL1 = RINK.x + RINK.w * 0.066;   // left  goal line  ≈  70
const GL2 = RINK.x + RINK.w * 0.934;   // right goal line  ≈ 730
const BL1 = RINK.x + RINK.w * 0.310;   // left  blue line  ≈ 256
const BL2 = RINK.x + RINK.w * 0.690;   // right blue line  ≈ 545

const NET_HW = Math.round(RINK.h * 0.072);   // net half-width  ≈ 32
const NET_D  = Math.round(RINK.w * 0.024);   // net depth       ≈ 18

// Net bounding boxes (goal detection in later chunk)
const LNET = { x: GL1 - NET_D, y: RINK.cy - NET_HW, w: NET_D, h: NET_HW * 2 };
const RNET = { x: GL2,         y: RINK.cy - NET_HW, w: NET_D, h: NET_HW * 2 };

function rinkPath() {
  const { x, y, w, h, r } = RINK;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y,     x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h,     x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y,         x + r, y);
  ctx.closePath();
}

function drawRink() {
  // ── clip everything to rink shape
  ctx.save();
  rinkPath();
  ctx.clip();

  // ice
  ctx.fillStyle = '#C8EAF2';
  ctx.fillRect(RINK.x, RINK.y, RINK.w, RINK.h);

  // subtle ice texture lines
  ctx.strokeStyle = 'rgba(180,220,240,0.5)';
  ctx.lineWidth = 1;
  for (let iy = RINK.y + 20; iy < RINK.y + RINK.h; iy += 20) {
    ctx.beginPath();
    ctx.moveTo(RINK.x, iy);
    ctx.lineTo(RINK.x + RINK.w, iy);
    ctx.stroke();
  }

  // ── centre-ice logo (home team) drawn before lines so lines sit on top
  drawCenterIceLogo();

  // ── center red line (dashed)
  ctx.strokeStyle = '#CC1111';
  ctx.lineWidth = 5;
  ctx.setLineDash([10, 7]);
  ctx.beginPath();
  ctx.moveTo(RINK.cx, RINK.y);
  ctx.lineTo(RINK.cx, RINK.y + RINK.h);
  ctx.stroke();
  ctx.setLineDash([]);

  // ── blue lines
  ctx.strokeStyle = '#1133CC';
  ctx.lineWidth = 5;
  [BL1, BL2].forEach(bx => {
    ctx.beginPath();
    ctx.moveTo(bx, RINK.y);
    ctx.lineTo(bx, RINK.y + RINK.h);
    ctx.stroke();
  });

  // ── goal lines
  const glMargin = RINK.r * 0.42;
  ctx.strokeStyle = '#CC1111';
  ctx.lineWidth = 2;
  [GL1, GL2].forEach(gx => {
    ctx.beginPath();
    ctx.moveTo(gx, RINK.y + glMargin);
    ctx.lineTo(gx, RINK.y + RINK.h - glMargin);
    ctx.stroke();
  });

  // ── center ice circle + dot
  const cR = RINK.h * 0.20;
  ctx.strokeStyle = '#CC1111';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(RINK.cx, RINK.cy, cR, 0, Math.PI * 2);
  ctx.stroke();
  ctx.fillStyle = '#CC1111';
  ctx.beginPath();
  ctx.arc(RINK.cx, RINK.cy, 5, 0, Math.PI * 2);
  ctx.fill();

  // ── end-zone face-off circles + dots
  const foR  = RINK.h * 0.17;
  const foOX = RINK.w * 0.078;
  const foOY = RINK.h * 0.245;
  const foPositions = [
    [GL1 + foOX, RINK.cy - foOY], [GL1 + foOX, RINK.cy + foOY],
    [GL2 - foOX, RINK.cy - foOY], [GL2 - foOX, RINK.cy + foOY],
  ];
  ctx.strokeStyle = '#CC1111';
  ctx.lineWidth = 2;
  foPositions.forEach(([fx, fy]) => {
    ctx.beginPath();
    ctx.arc(fx, fy, foR, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = '#CC1111';
    ctx.beginPath();
    ctx.arc(fx, fy, 4, 0, Math.PI * 2);
    ctx.fill();
  });

  // ── neutral zone dots (no circles)
  const nzOX = RINK.w * 0.076;
  [
    [RINK.cx - nzOX, RINK.cy - foOY], [RINK.cx - nzOX, RINK.cy + foOY],
    [RINK.cx + nzOX, RINK.cy - foOY], [RINK.cx + nzOX, RINK.cy + foOY],
  ].forEach(([nx, ny]) => {
    ctx.fillStyle = '#CC1111';
    ctx.beginPath();
    ctx.arc(nx, ny, 4, 0, Math.PI * 2);
    ctx.fill();
  });

  // ── goal creases (D-shapes)
  const creaseR = RINK.h * 0.13;
  ctx.fillStyle   = 'rgba(60, 140, 230, 0.25)';
  ctx.strokeStyle = '#2244CC';
  ctx.lineWidth   = 2;

  // left crease — D opens toward center (right half of circle)
  ctx.beginPath();
  ctx.arc(GL1, RINK.cy, creaseR, 3 * Math.PI / 2, Math.PI / 2, false);
  ctx.closePath();
  ctx.fill(); ctx.stroke();

  // right crease — D opens toward center (left half of circle)
  ctx.beginPath();
  ctx.arc(GL2, RINK.cy, creaseR, Math.PI / 2, 3 * Math.PI / 2, false);
  ctx.closePath();
  ctx.fill(); ctx.stroke();

  // ── nets
  const netGray = 'rgba(140,140,140,0.65)';
  ctx.fillStyle = netGray;
  ctx.fillRect(LNET.x, LNET.y, LNET.w, LNET.h);
  ctx.fillRect(RNET.x, RNET.y, RNET.w, RNET.h);

  // net frames
  ctx.strokeStyle = '#888';
  ctx.lineWidth = 1;
  ctx.strokeRect(LNET.x, LNET.y, LNET.w, LNET.h);
  ctx.strokeRect(RNET.x, RNET.y, RNET.w, RNET.h);

  ctx.restore();

  // ── boards (drawn outside clip so stroke sits on the edge)
  rinkPath();
  ctx.strokeStyle = '#222266';
  ctx.lineWidth = 10;
  ctx.stroke();

  // ── goal posts (red, over boards)
  ctx.strokeStyle = '#EE2222';
  ctx.lineWidth = 4;
  [[GL1, LNET], [GL2, RNET]].forEach(([gx, net]) => {
    ctx.beginPath();
    ctx.moveTo(gx, net.y);
    ctx.lineTo(gx, net.y + net.h);
    ctx.stroke();
  });
}
</script>

<script>
// ─── Logo preloading ──────────────────────────────────────────────────────────
// Source: MLBAMGames/nhl_teams_logo_svg (GitHub raw) for 30 teams.
// SEA + UTA fall back to NHL CDN (newer franchises not in that repo).

const _LB  = 'https://raw.githubusercontent.com/MLBAMGames/nhl_teams_logo_svg/master/light/';
const _CDN = 'https://assets.nhle.com/logos/nhl/svg/';

// MLBAM internal codes differ from NHL abbrs for a few teams:
//   WPG → wng,  TBL → tbl,  NJD → njd,  LAK → lak,  SJS → sjs  (all fine)
const _MLBAM = {
  BOS:'bos', BUF:'buf', DET:'det', FLA:'fla', MTL:'mtl', OTT:'ott',
  TBL:'tbl', TOR:'tor', CAR:'car', CBJ:'cbj', NJD:'njd', NYI:'nyi',
  NYR:'nyr', PHI:'phi', PIT:'pit', WSH:'wsh', CHI:'chi', COL:'col',
  DAL:'dal', MIN:'min', NSH:'nsh', STL:'stl', WPG:'wng', ANA:'ana',
  CGY:'cgy', EDM:'edm', LAK:'lak', SJS:'sjs', VAN:'van', VGK:'vgk',
};

const LOGOS = {};   // abbr → HTMLImageElement, or null on error

(function preloadLogos() {
  Object.entries(_MLBAM).forEach(([abbr, file]) => {
    const img = new Image();
    img.onload  = () => { LOGOS[abbr] = img; };
    img.onerror = () => { LOGOS[abbr] = null; };
    img.src = _LB + file + '_l.svg';
  });
  // Newer franchises: try official NHL CDN
  ['SEA', 'UTA'].forEach(abbr => {
    const img = new Image();
    img.onload  = () => { LOGOS[abbr] = img; };
    img.onerror = () => { LOGOS[abbr] = null; };
    img.src = _CDN + abbr + '_light.svg';
  });
}());

// ─── Centre-ice logo ──────────────────────────────────────────────────────────
// Called by drawRink() inside its save/clip, so rink lines render on top.

function drawCenterIceLogo() {
  if (game.homeTeam === null) return;

  const team = TEAMS[game.homeTeam];
  const r    = Math.round(RINK.h * 0.188);
  const cx   = RINK.cx;
  const cy   = RINK.cy;
  const logo = LOGOS[team.abbr];

  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.clip();

  if (logo) {
    ctx.drawImage(logo, cx - r, cy - r, r * 2, r * 2);
  } else {
    // coloured badge fallback
    ctx.fillStyle = team.primary;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
    const sh = r * 0.21;
    ctx.fillStyle = team.secondary;
    ctx.fillRect(cx - r, cy - sh * 2.1, r * 2, sh);
    ctx.fillRect(cx - r, cy + sh * 1.1, r * 2, sh);
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth   = 3;
    ctx.beginPath();
    ctx.arc(cx, cy, r - 3, 0, Math.PI * 2);
    ctx.stroke();
  }

  ctx.restore();

  // text abbreviation only when logo not available
  if (!logo) {
    const fs = Math.round(r * 0.38);
    ctx.font         = fs + 'px "Press Start 2P"';
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle    = 'rgba(0,0,0,0.5)';
    ctx.fillText(team.abbr, cx + 2, cy + 3);
    ctx.fillStyle    = team.textColor;
    ctx.fillText(team.abbr, cx, cy);
  }
}
</script>

<script>
// ─── Chunk 5: Scoreboard (90s ESPN style) ────────────────────────────────────

let _clock    = game.periodTime;  // seconds remaining
let _prevRafT = null;

function tickClock(t) {
  if (game.state === 'playing') {
    if (_prevRafT !== null) {
      _clock -= (t - _prevRafT) / 1000;
      if (_clock <= 0) { _clock = 0; game.state = 'period_end'; }
    }
    _prevRafT = t;
  } else {
    _prevRafT = null;
  }
}

function fmtClock(s) {
  s = Math.max(0, Math.ceil(s));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

const _PER = ['', '1ST', '2ND', '3RD', 'OT'];
const SB_H = 36;   // scoreboard bar height (fits above RINK.y = 38)

function drawScoreboard() {
  if (game.homeTeam === null || game.awayTeam === null) return;

  const home = TEAMS[game.homeTeam];
  const away = TEAMS[game.awayTeam];

  // ── dark ESPN background
  ctx.fillStyle = '#06080f';
  ctx.fillRect(0, 0, W, SB_H);

  // ── bottom rule: home-color → dark-gold → away-color
  const gr = ctx.createLinearGradient(0, 0, W, 0);
  gr.addColorStop(0,    home.primary);
  gr.addColorStop(0.38, '#7a5e08');
  gr.addColorStop(0.62, '#7a5e08');
  gr.addColorStop(1,    away.primary);
  ctx.fillStyle = gr;
  ctx.fillRect(0, SB_H - 3, W, 3);

  // ── team-colour side tabs
  ctx.fillStyle = home.primary;
  ctx.fillRect(0, 0, 7, SB_H - 3);
  ctx.fillStyle = away.primary;
  ctx.fillRect(W - 7, 0, 7, SB_H - 3);

  const lsz  = 26;   // mini-logo size
  const hLogo = typeof LOGOS !== 'undefined' ? LOGOS[home.abbr] : null;
  const aLogo = typeof LOGOS !== 'undefined' ? LOGOS[away.abbr] : null;

  // ── home logo + label
  if (hLogo) ctx.drawImage(hLogo, 10, 4, lsz, lsz);
  ctx.fillStyle    = '#C8D8E8';

<script>
// ─── Chunk 6: Player sprites ──────────────────────────────────────────────────
// players[] holds every on-ice skater/goalie for both teams.
// dir = angle in radians; 0 = facing right, Math.PI = facing left.

const players = [];

function initPlayers() {
  players.length = 0;
  if (game.homeTeam === null || game.awayTeam === null) return;

  function lineup(roster) {
    const G  = roster.find(p => p.pos === 'G');
    const Ds = roster.filter(p => p.pos === 'D').slice(0, 2);
    const Fs = roster.filter(p => ['C','LW','RW'].includes(p.pos)).slice(0, 3);
    return [G, ...Ds, ...Fs].filter(Boolean);
  }

  // Faceoff positions ─ home on left (dir=0), away on right (dir=π)
  const hPos = [
    { x: GL1 - 8,         y: RINK.cy      },   // goalie
    { x: BL1 - 34,        y: RINK.cy - 62 },   // LD
    { x: BL1 - 34,        y: RINK.cy + 62 },   // RD
    { x: RINK.cx - 46,    y: RINK.cy - 52 },   // LW
    { x: RINK.cx - 14,    y: RINK.cy      },   // C  ← P1 controls
    { x: RINK.cx - 46,    y: RINK.cy + 52 },   // RW
  ];
  const aPos = [
    { x: GL2 + 8,         y: RINK.cy      },
    { x: BL2 + 34,        y: RINK.cy - 62 },
    { x: BL2 + 34,        y: RINK.cy + 62 },
    { x: RINK.cx + 46,    y: RINK.cy - 52 },
    { x: RINK.cx + 14,    y: RINK.cy      },   // C  ← P2 controls
    { x: RINK.cx + 46,    y: RINK.cy + 52 },
  ];

  const hLine = lineup(TEAMS[game.homeTeam].roster);
  const aLine = lineup(TEAMS[game.awayTeam].roster);

  hLine.forEach((r, i) => {
    if (!hPos[i]) return;
    players.push({ ...hPos[i], vx:0, vy:0, dir:0,         team:0,
                   isGoalie: r.pos==='G', controlled: i===4,
                   rIdx: TEAMS[game.homeTeam].roster.indexOf(r) });
  });
  aLine.forEach((r, i) => {
    if (!aPos[i]) return;
    players.push({ ...aPos[i], vx:0, vy:0, dir:Math.PI,   team:1,
                   isGoalie: r.pos==='G', controlled: i===4,
                   rIdx: TEAMS[game.awayTeam].roster.indexOf(r) });
  });
}

// ── Draw a single sprite (local space: facing right = dir 0)
function drawSprite(x, y, dir, isGoalie, controlled, team) {
  ctx.save();
  ctx.translate(Math.round(x), Math.round(y));
  ctx.rotate(dir);

  // controlled-player dashed ring
  if (controlled) {
    ctx.strokeStyle = 'rgba(255,255,255,0.92)';
    ctx.lineWidth   = 2;
    ctx.setLineDash([4, 3]);
    ctx.beginPath();
    ctx.arc(0, 0, 14, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // goalie blocker / pads (wide rectangles either side)
  if (isGoalie) {
    ctx.fillStyle = team.secondary === team.primary
      ? 'rgba(255,255,255,0.6)' : team.secondary;
    ctx.fillRect(-12, -3, 4, 6);
    ctx.fillRect(8,   -3, 4, 6);
  }

  // body circle
  const r = isGoalie ? 9 : 8;
  ctx.fillStyle   = team.primary;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();
  // jersey outline in secondary colour
  ctx.strokeStyle = team.secondary === team.primary
    ? 'rgba(255,255,255,0.5)' : team.secondary;
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // head (helmet = primary, face = skin tone below centre)
  ctx.fillStyle = team.primary;
  ctx.beginPath();
  ctx.arc(r + 2, 0, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#DCA870';
  ctx.beginPath();
  ctx.arc(r + 2, 1, 2.5, 0, Math.PI);   // lower-face semicircle
  ctx.fill();

  // stick (skaters only – extends right-forward in local space)
  if (!isGoalie) {
    ctx.strokeStyle = '#A07038';
    ctx.lineWidth   = 2;
    ctx.lineCap     = 'round';
    ctx.beginPath();
    ctx.moveTo(2,  r);       // grip on hip
    ctx.lineTo(10, r + 8);   // shaft
    ctx.lineTo(18, r + 3);   // blade
    ctx.stroke();
  }

  ctx.restore();
}

function drawAllPlayers() {
  if (players.length === 0 && game.homeTeam !== null) initPlayers();
  players.forEach(p => {
    const team = p.team === 0 ? TEAMS[game.homeTeam] : TEAMS[game.awayTeam];
    drawSprite(p.x, p.y, p.dir, p.isGoalie, p.controlled, team);
  });
}
</script>

<script>
// ─── Chunk 7: Player movement ─────────────────────────────────────────────────
// Ice physics: acceleration, friction, speed cap scaled by player spd stat.
// P1 → Arrow keys   P2 → WASD
// Rink boundary uses elliptical approximation of the rounded-corner oval.

const ACCEL    = 0.52;   // px / frame²  (per axis)
const FRICTION = 0.83;   // velocity multiplier per frame
const MAX_SPD  = 4.4;    // px / frame for a spd-98 player

function statMax(rIdx, team) {
  const roster = team === 0 ? TEAMS[game.homeTeam].roster : TEAMS[game.awayTeam].roster;
  const r = roster[rIdx];
  return r ? MAX_SPD * r.spd / 98 : MAX_SPD * 0.82;
}

// Elliptical rink boundary (good enough for a SNES-style game)
function clampToRink(x, y) {
  const bd = 13;                         // player radius + board padding
  const ax = RINK.w / 2 - bd;           // ellipse x semi-axis
  const ay = RINK.h / 2 - bd;           // ellipse y semi-axis
  const dx = x - RINK.cx;
  const dy = y - RINK.cy;
  const e  = (dx / ax) * (dx / ax) + (dy / ay) * (dy / ay);
  if (e > 1) {
    const s = 1 / Math.sqrt(e);
    x = RINK.cx + dx * s;
    y = RINK.cy + dy * s;
  }
  return [x, y];
}

// Goalie x-range: keeps them within the crease area
function clampGoalie(p) {
  const creaseX = RINK.h * 0.13 + 6;   // crease depth + slack
  if (p.team === 0) p.x = Math.min(GL1 + creaseX, Math.max(RINK.x + 10, p.x));
  else              p.x = Math.max(GL2 - creaseX, Math.min(RINK.x + RINK.w - 10, p.x));
}

function movePlayer(p, upKey, downKey, leftKey, rightKey) {
  const maxSpd = statMax(p.rIdx, p.team);
  const accel  = ACCEL * (maxSpd / MAX_SPD);   // faster players accelerate harder

  let ax = 0, ay = 0;
  if (keys[leftKey])  ax -= accel;
  if (keys[rightKey]) ax += accel;
  if (keys[upKey])    ay -= accel;
  if (keys[downKey])  ay += accel;

  // Diagonal normalisation — prevent 41% speed bonus
  if (ax !== 0 && ay !== 0) { ax *= 0.7071; ay *= 0.7071; }

  // Friction first, then add acceleration (natural ice feel)
  p.vx = p.vx * FRICTION + ax;
  p.vy = p.vy * FRICTION + ay;

  // Speed cap
  const spd = Math.hypot(p.vx, p.vy);
  if (spd > maxSpd) { p.vx = p.vx / spd * maxSpd; p.vy = p.vy / spd * maxSpd; }

  // Face direction of travel
  if (spd > 0.25) p.dir = Math.atan2(p.vy, p.vx);

  p.x += p.vx;
  p.y += p.vy;

  if (p.isGoalie) clampGoalie(p);
  [p.x, p.y] = clampToRink(p.x, p.y);
}

function updatePlayers() {
  if (game.state !== 'playing') return;

  players.forEach(p => {
    if (!p.controlled) {
      // Non-controlled: coast to a stop
      p.vx *= FRICTION;
      p.vy *= FRICTION;
      p.x  += p.vx;
      p.y  += p.vy;
      [p.x, p.y] = clampToRink(p.x, p.y);
      return;
    }
    if (p.team === 0) {
      movePlayer(p, 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight');
    } else {
      movePlayer(p, 'KeyW', 'KeyS', 'KeyA', 'KeyD');
    }
  });
}
</script>

<script>
// ─── Chunk 8: Player collisions ───────────────────────────────────────────────
// Simple elastic-impulse collision between every pair of players.
// Same-team contacts barely bounce; cross-team contacts use the chk stat
// to scale the impulse so hard-checkers hit harder.

const PLAYER_R = 10;                  // collision radius per player (px)
const MIN_SEP  = PLAYER_R * 2;       // minimum centre-to-centre distance

function getRoster(p) {
  return p.team === 0 ? TEAMS[game.homeTeam].roster : TEAMS[game.awayTeam].roster;
}

function resolveCollisions() {
  if (game.state !== 'playing') return;

  for (let i = 0; i < players.length; i++) {
    for (let j = i + 1; j < players.length; j++) {
      const a = players[i], b = players[j];

      const dx   = b.x - a.x;
      const dy   = b.y - a.y;
      const dist = Math.hypot(dx, dy);
      if (dist >= MIN_SEP || dist < 0.01) continue;

      // Unit normal a → b
      const nx = dx / dist, ny = dy / dist;

      // ── Push positions apart equally
      const half = (MIN_SEP - dist) * 0.51;
      a.x -= nx * half;  a.y -= ny * half;
      b.x += nx * half;  b.y += ny * half;

      // ── Velocity impulse
      const dvn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
      if (dvn >= 0) continue;   // already separating — skip

      const sameTeam = a.team === b.team;

      // Restitution: same-team just slides apart; cross-team bounces
      const e = sameTeam ? 0.06 : 0.38;
      let impulse = -(1 + e) * dvn / 2;

      // Cross-team: add checking bonus based on chk stats & approach speed
      if (!sameTeam) {
        const aStats = getRoster(a)[a.rIdx] || { chk: 80 };
        const bStats = getRoster(b)[b.rIdx] || { chk: 80 };
        const aSpd   = Math.hypot(a.vx, a.vy);
        const bSpd   = Math.hypot(b.vx, b.vy);
        // Extra shove: attacker's check power minus defender's resistance
        const bonus = Math.max(0, aSpd * aStats.chk / 98 - bSpd * bStats.chk / 98) * 0.28;
        impulse += bonus;
      }

      a.vx -= impulse * nx;  a.vy -= impulse * ny;
      b.vx += impulse * nx;  b.vy += impulse * ny;

      // Cap post-collision speed so nobody launches off the screen
      const capSpd = MAX_SPD * 1.7;
      for (const p of [a, b]) {
        const s = Math.hypot(p.vx, p.vy);
        if (s > capSpd) { p.vx = p.vx / s * capSpd; p.vy = p.vy / s * capSpd; }
      }

      [a.x, a.y] = clampToRink(a.x, a.y);
      [b.x, b.y] = clampToRink(b.x, b.y);
    }
  }
}
</script>

<script>
// ─── Chunk 9: Puck ────────────────────────────────────────────────────────────

const PUCK_R      = 5;
const PUCK_FRIC   = 0.987;   // slides a long way
const PUCK_PICKUP = 18;      // auto-pickup radius
const STICK_FWD   = 15;      // puck offset in facing direction when carried
const STICK_SIDE  = 10;      // puck offset sideways when carried

const puck = {
  x: RINK.cx, y: RINK.cy,
  vx: 0, vy: 0,
  carrier:      null,   // player holding the puck
  immune:       null,   // player who just shot (can't immediately re-pick up)
  immuneTimer:  0,
};

let _faceoffTimer = 0;
const FACEOFF_FRAMES = 180;  // 3-second countdown at 60 fps

function initPuck() {
  puck.x = RINK.cx;  puck.y = RINK.cy;
  puck.vx = 0;       puck.vy = 0;
  puck.carrier     = null;
  puck.immune      = null;
  puck.immuneTimer = 0;
  _faceoffTimer    = 0;
}

// ── Board bounce using the elliptical rink normal ─────────────────────────────
function bouncePuck() {
  const bd  = PUCK_R + 9;
  const ax  = RINK.w / 2 - bd;
  const ay  = RINK.h / 2 - bd;
  const dx  = puck.x - RINK.cx;
  const dy  = puck.y - RINK.cy;
  const e   = (dx / ax) * (dx / ax) + (dy / ay) * (dy / ay);
  if (e <= 1) return;

  // Gradient of the ellipse equation gives the outward normal
  const nx   = dx / (ax * ax);
  const ny   = dy / (ay * ay);
  const nLen = Math.hypot(nx, ny);
  const nnx  = nx / nLen,  nny = ny / nLen;

  // Push puck back to the surface
  const s = 1 / Math.sqrt(e);
  puck.x = RINK.cx + dx * s;
  puck.y = RINK.cy + dy * s;

  // Reflect velocity (72 % restitution off boards)
  const vDotN = puck.vx * nnx + puck.vy * nny;
  if (vDotN > 0) {
    puck.vx -= 2 * vDotN * nnx * 0.72;
    puck.vy -= 2 * vDotN * nny * 0.72;
  }
}

// ── Puck update ───────────────────────────────────────────────────────────────
function updatePuck() {
  // Initialise players + puck on first faceoff frame
  if (players.length === 0 && game.homeTeam !== null) {
    initPlayers();
    initPuck();
  }

  // Faceoff countdown — auto-advance to 'playing'
  if (game.state === 'faceoff') {
    _faceoffTimer++;
    if (_faceoffTimer >= FACEOFF_FRAMES) {
      _faceoffTimer = 0;
      game.state = 'playing';
    }
    return;
  }

  if (game.state !== 'playing') return;

  // Immune timer (prevents instant re-pickup after a shot)
  if (puck.immuneTimer > 0) puck.immuneTimer--;
  else                       puck.immune = null;

  if (puck.carrier) {
    // Puck sits at the stick blade in local → world coordinates
    const p   = puck.carrier;
    const cos = Math.cos(p.dir), sin = Math.sin(p.dir);
    puck.x  = p.x + cos * STICK_FWD - sin * STICK_SIDE;
    puck.y  = p.y + sin * STICK_FWD + cos * STICK_SIDE;
    puck.vx = p.vx;
    puck.vy = p.vy;
    return;
  }

  // Free puck: friction + movement + board bounce
  puck.vx *= PUCK_FRIC;
  puck.vy *= PUCK_FRIC;
  puck.x  += puck.vx;
  puck.y  += puck.vy;
  bouncePuck();

  // Nearest player within pickup radius auto-collects the puck
  let best = null, bestDist = PUCK_PICKUP;
  for (const p of players) {
    if (p === puck.immune) continue;
    const d = Math.hypot(puck.x - p.x, puck.y - p.y);
    if (d < bestDist) { bestDist = d; best = p; }
  }
  if (best) puck.carrier = best;
}

// ── Draw the puck ─────────────────────────────────────────────────────────────
function drawPuck() {
  // Drop shadow
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath();
  ctx.ellipse(puck.x + 2, puck.y + 3, PUCK_R + 2, (PUCK_R + 2) * 0.55, 0, 0, Math.PI * 2);
  ctx.fill();

  // Puck body (top-down flat cylinder = ellipse)
  ctx.fillStyle = '#0a0a0a';
  ctx.beginPath();
  ctx.ellipse(puck.x, puck.y, PUCK_R, PUCK_R * 0.65, 0, 0, Math.PI * 2);
  ctx.fill();

  // Subtle edge highlight
  ctx.strokeStyle = 'rgba(255,255,255,0.2)';
  ctx.lineWidth   = 1;
  ctx.beginPath();
  ctx.ellipse(puck.x, puck.y, PUCK_R, PUCK_R * 0.65, 0, 0, Math.PI * 2);
  ctx.stroke();
}

// ── Faceoff countdown overlay ─────────────────────────────────────────────────
function drawFaceoffOverlay() {
  if (game.state !== 'faceoff') return;

  // Translucent dim
  ctx.fillStyle = 'rgba(0,0,10,0.45)';
  ctx.fillRect(0, 0, W, H);

  const secs = Math.ceil((FACEOFF_FRAMES - _faceoffTimer) / 60);
  const label = secs > 0 ? String(secs) : 'FACE-OFF!';

  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.font      = '28px "Press Start 2P"';
  ctx.fillText(label, W / 2 + 3, H / 2 + 3);

  // Label
  ctx.fillStyle = secs > 0 ? '#FFD700' : '#FF4444';
  ctx.fillText(label, W / 2, H / 2);

  // Period info below
  ctx.fillStyle = '#6688AA';
  ctx.font      = '9px "Press Start 2P"';
  ctx.fillText('PERIOD  ' + game.period + '  OF  3', W / 2, H / 2 + 36);
}
</script>

<script>
// ─── Chunk 10: Shooting ───────────────────────────────────────────────────────
// Wrist shot: tap shoot key  (held < 15 frames) → quick, 62 % base speed.
// Slap  shot: hold then release → charge bar appears, full power at 50 frames.
// Shot speed: 10–18 px/frame scaled by sht stat + charge level.
// P1 = SPACE   P2 = ENTER

const charge     = [0, 0];     // charge frames per team
const MAX_CHARGE = 50;

// ── Increment charge while shoot key is held by the puck carrier ─────────────
function updateShooting() {
  if (game.state !== 'playing') return;

  [0, 1].forEach(team => {
    const key    = team === 0 ? 'Space' : 'Enter';
    const carrier = puck.carrier;
    const ctrl    = players.find(p => p.team === team && p.controlled);
    if (keys[key] && ctrl && carrier === ctrl) {
      charge[team] = Math.min(charge[team] + 1, MAX_CHARGE);
    } else if (!keys[key]) {
      charge[team] = 0;   // key released — reset (shot was fired via onKeyUp)
    }
  });
}

// ── Fire the shot on key release ─────────────────────────────────────────────
function tryShoot(teamIdx) {
  const frames = charge[teamIdx];
  charge[teamIdx] = 0;

  if (game.state !== 'playing') return;
  const ctrl = players.find(p => p.team === teamIdx && p.controlled);
  if (!ctrl || puck.carrier !== ctrl) return;   // must be holding puck

  const roster = teamIdx === 0 ? TEAMS[game.homeTeam].roster
                               : TEAMS[game.awayTeam].roster;
  const sht    = (roster[ctrl.rIdx] || { sht: 80 }).sht;

  // Base speed: 10 px/frame (sht 0) → 18 px/frame (sht 98)
  const baseSpd = 10 + sht / 98 * 8;
  const isSlap  = frames >= 15;
  const c       = Math.min(frames / MAX_CHARGE, 1);

  // Wrist: 62 % base.  Slap: 85 %–170 % base, scaling with charge.
  const shotSpd = isSlap ? baseSpd * (0.85 + c * 0.85)
                         : baseSpd * 0.62;

  puck.vx          = Math.cos(ctrl.dir) * shotSpd;
  puck.vy          = Math.sin(ctrl.dir) * shotSpd;
  puck.carrier     = null;
  puck.immune      = ctrl;
  puck.immuneTimer = 28;   // ~0.5 s at 60 fps
}

// ── Charge bar drawn above the carrier ───────────────────────────────────────
function drawShootingEffects() {
  if (game.state !== 'playing') return;

  [0, 1].forEach(team => {
    const c = charge[team];
    if (c < 4) return;

    const ctrl = players.find(p => p.team === team && p.controlled
                                && p === puck.carrier);
    if (!ctrl) return;

    const pct  = Math.min(c / MAX_CHARGE, 1);
    const barW = 26, barH = 4;
    const bx   = ctrl.x - barW / 2;
    const by   = ctrl.y - 26;

    // Background
    ctx.fillStyle = '#111';
    ctx.fillRect(bx - 1, by - 1, barW + 2, barH + 2);

    // Fill: green → yellow → red
    ctx.fillStyle = `hsl(${Math.round(120 - pct * 120)},100%,50%)`;
    ctx.fillRect(bx, by, barW * pct, barH);

    // "SHOOT!" flash when fully charged
    if (pct >= 0.98) {
      ctx.fillStyle    = '#FFFFFF';
      ctx.font         = '5px "Press Start 2P"';
      ctx.textAlign    = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillText('SHOOT!', ctrl.x, by - 1);
    }
  });
}

// ── Patch key handlers to fire shot on release ────────────────────────────────
const _prevKeyUp = onKeyUp;
onKeyUp = function patchedKeyUp(code) {
  _prevKeyUp(code);
  if (code === 'Space') tryShoot(0);
  if (code === 'Enter') tryShoot(1);
};
</script>

<script>
// ─── Chunk 11: Passing + one-timer ────────────────────────────────────────────
// Q = P1 pass   E = P2 pass
// Hold shoot key while receiving a pass → one-timer (30 % power bonus)

// Pick the best teammate to receive: prefer players ahead of the carrier
function bestPassTarget(carrier, teamIdx) {
  const cos = Math.cos(carrier.dir), sin = Math.sin(carrier.dir);
  const candidates = players.filter(p => p.team === teamIdx && p !== carrier);
  if (!candidates.length) return null;

  let best = null, bestScore = Infinity;
  candidates.forEach(t => {
    const dx = t.x - carrier.x, dy = t.y - carrier.y;
    const dist  = Math.hypot(dx, dy);
    const fwd   = cos * dx + sin * dy;          // +ve = in front of carrier
    const score = dist - (fwd > 0 ? 40 : 0);   // 40 px bonus for forward targets
    if (score < bestScore) { bestScore = score; best = t; }
  });
  return best;
}

function tryPass(teamIdx) {
  if (game.state !== 'playing') return;
  const ctrl = players.find(p => p.team === teamIdx && p.controlled);
  if (!ctrl || puck.carrier !== ctrl) return;

  const target = bestPassTarget(ctrl, teamIdx);
  if (!target) return;

  const roster  = teamIdx === 0 ? TEAMS[game.homeTeam].roster
                                : TEAMS[game.awayTeam].roster;
  const pas     = (roster[ctrl.rIdx] || { pas: 80 }).pas;
  const passSpd = 8 + pas / 98 * 6;     // 8–14 px/frame scaled by pas stat

  const dx = target.x - puck.x, dy = target.y - puck.y;
  const d  = Math.hypot(dx, dy);
  if (d < 1) return;

  puck.vx          = dx / d * passSpd;
  puck.vy          = dy / d * passSpd;
  puck.carrier     = null;
  puck.immune      = ctrl;
  puck.immuneTimer = 18;
}

// ── One-timer: fire immediately when shoot key is held at moment of pickup ────
let _prevCarrier = null;

function updatePassing() {
  if (game.state !== 'playing') { _prevCarrier = puck.carrier; return; }

  const cur = puck.carrier;
  // Detect the frame the puck was just picked up
  if (cur !== null && _prevCarrier === null && cur.controlled) {
    const key = cur.team === 0 ? 'Space' : 'Enter';
    if (keys[key]) fireOnetimer(cur);
  }
  _prevCarrier = cur;
}

function fireOnetimer(p) {
  const roster = p.team === 0 ? TEAMS[game.homeTeam].roster
                              : TEAMS[game.awayTeam].roster;
  const sht  = (roster[p.rIdx] || { sht: 80 }).sht;
  const spd  = (10 + sht / 98 * 8) * 1.30;   // 30 % bonus — one-timers are hard!

  puck.vx          = Math.cos(p.dir) * spd;
  puck.vy          = Math.sin(p.dir) * spd;
  puck.carrier     = null;
  puck.immune      = p;
  puck.immuneTimer = 28;
  charge[p.team]   = 0;
}

// ── Dashed ring on likely pass recipient (always visible when carrier has puck)
function drawPassIndicator() {
  if (game.state !== 'playing') return;
  [0, 1].forEach(team => {
    const ctrl = players.find(p => p.team === team && p.controlled
                                && p === puck.carrier);
    if (!ctrl) return;
    const target = bestPassTarget(ctrl, team);
    if (!target) return;

    ctx.strokeStyle  = team === 0 ? 'rgba(255,215,0,0.65)' : 'rgba(0,229,255,0.65)';
    ctx.lineWidth    = 1.5;
    ctx.setLineDash([3, 3]);
    ctx.beginPath();
    ctx.arc(target.x, target.y, 16, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
  });
}

// ── Patch onKeyDown for pass keys ─────────────────────────────────────────────
const _prevKD11 = onKeyDown;
onKeyDown = function(code) {
  _prevKD11(code);
  if (code === 'KeyQ') tryPass(0);
  if (code === 'KeyE') tryPass(1);
};
</script>

<!-- ═══════════════════════════════════════════════════════════════════════════
     CHUNK 12 — GOALIE AI
     ═══════════════════════════════════════════════════════════════════════════ -->
<script>
function goalieTargetPos(g) {
  const isHome = g.team === 0;
  const netX   = isHome ? GL2 : GL1;
  const netY   = RINK.cy;
  const dx     = puck.x - netX;
  const dy     = puck.y - netY;
  const dist   = Math.sqrt(dx * dx + dy * dy) || 1;
  const creaseReach = NET_D + 2;
  const fraction    = Math.min(creaseReach / dist, 1);
  return { x: netX + dx * fraction, y: netY + dy * fraction };
}

function updateGoalieAI() {
  if (game.state !== 'playing') return;
  players.forEach(g => {
    if (!g.isGoalie) return;
    const roster = g.team === 0
      ? TEAMS[game.homeTeam].roster
      : TEAMS[game.awayTeam].roster;
    const save = (roster[g.rIdx] || { save: 85 }).save;

    let spd = 1.6 + (save - 80) / 13 * 0.8;   // 1.6–2.4 px/frame

    // Dive faster when shot is incoming
    const isHome  = g.team === 0;
    const puckSpd = Math.sqrt(puck.vx * puck.vx + puck.vy * puck.vy);
    const movingIn = isHome ? puck.vx > 0 : puck.vx < 0;
    if (puckSpd > 3.5 && movingIn && puck.carrier === null) spd *= 2.5;

    const target = goalieTargetPos(g);
    const ex = target.x - g.x;
    const ey = target.y - g.y;
    const ed = Math.sqrt(ex * ex + ey * ey) || 1;
    if (ed > 1) {
      const move = Math.min(spd, ed);
      g.x += (ex / ed) * move;
      g.y += (ey / ed) * move;
    }

    g.dir = Math.atan2(puck.y - g.y, puck.x - g.x);

    clampGoalie(g);
    [g.x, g.y] = clampToRink(g.x, g.y);
    g.vx = 0;
    g.vy = 0;
  });
}
</script>
